name: Publish PulseCord

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulsecord-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-24.04
            platform: linux
          - os: macos-15-intel
            platform: macos
    runs-on: ${{ matrix.os }}
    env:
      PULSECORD_RELEASE_NOTES: .cache/release-notes.md
      DISPLAY: ':99'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.19.0
          require-lockfile: true
          cache: true
      - name: Prepare Linux graphical and Flatpak test environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 libfuse2t64 flatpak dbus-x11 desktop-file-utils
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          Xvfb :99 -screen 0 1280x900x24 -nolisten tcp >/tmp/pulsecord-xvfb.log 2>&1 &
      - name: Prepare toolchain
        run: |
          npm install --prefix .cache/corepack --no-package-lock --ignore-scripts corepack@0.35.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $toolBin = Join-Path $PWD '.cache/corepack/node_modules/.bin'
          $toolBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Generate release notes
        run: node scripts/release-notes.mjs
      - name: Prepare publisher key
        env:
          PULSECORD_UPDATE_KEY_PEM: ${{ secrets.PULSECORD_UPDATE_KEY_PEM }}
        run: node scripts/setup-updates.mjs
      - name: Prepare pinned fork
        run: |
          node scripts/prepare.mjs --fetch-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --dir upstream/equicord install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and validate
        run: |
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and smoke-test the installer
        run: |
          pnpm package:installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/run-installer.mjs --packaged-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ matrix.platform }}' -eq 'macos') {
            node scripts/test-macos.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify a real isolated Discord Flatpak and its relaunch
        if: runner.os == 'Linux'
        shell: bash
        env:
          PULSECORD_REAL_FLATPAK_TEST: '1'
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive --assumeyes flathub com.discordapp.Discord
          dbus-run-session -- node scripts/test-flatpak.mjs
      - name: Sign update and archive source
        run: |
          pnpm publish:prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('${{ matrix.platform }}' -eq 'macos') {
            node scripts/publish-update.mjs --arch=arm64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ('${{ matrix.platform }}' -eq 'windows') {
            pnpm package:source
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item .cache/release-notes.md release/RELEASE-NOTES.md
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/PulseCord Installer.exe
            release/PulseCord Installer-linux-x64.AppImage
            release/PulseCord Installer-linux-x64.tar.gz
            release/PulseCord Installer-macos-universal.dmg
            release/PulseCord-source.zip
            release/RELEASE-NOTES.md
            release/updates/*
      - name: Remove temporary signing key
        if: always()
        run: |
          $keyFile = Join-Path $env:GITHUB_WORKSPACE '.pulsecord-publisher/private-key.pem'
          if (Test-Path -LiteralPath $keyFile) { [IO.File]::Delete($keyFile) }

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish one verified release for Windows, Linux and macOS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-multiplatform.mjs
      - name: Verify all public signed updates
        run: |
          node scripts/verify-published-update.mjs --platform=win32 --arch=x64 --manifest=release-artifacts/windows/updates/pulsecord-update.json
          node scripts/verify-published-update.mjs --platform=linux --arch=x64 --manifest=release-artifacts/linux/updates/pulsecord-update-linux-x64.json
          node scripts/verify-published-update.mjs --platform=darwin --arch=x64 --manifest=release-artifacts/macos/updates/pulsecord-update-darwin-x64.json
          node scripts/verify-published-update.mjs --platform=darwin --arch=arm64 --manifest=release-artifacts/macos/updates/pulsecord-update-darwin-arm64.json
