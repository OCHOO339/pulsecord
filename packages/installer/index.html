<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'"><title>PulseCord Installer</title><link rel="stylesheet" href="ui.css"></head>
<body><header class="titlebar"><img src="assets/pulsecord-logo.png" width="18" height="18" alt=""><span>PulseCord Installer</span><div class="window-actions"><button id="minimize" aria-label="Réduire" title="Réduire"><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button><button id="close" aria-label="Fermer" title="Fermer"><svg viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></svg></button></div></header>
<main>
<section data-step="0" aria-labelledby="license-title"><h1 id="license-title"><svg viewBox="0 0 24 24"><path d="m3 8 9-5 9 5M3 21h18M5 10v8m5-8v8m4-8v8m5-8v8M3 8h18"/></svg>Licence PulseCord</h1><div class="license-panel" tabindex="0" aria-label="Licence PulseCord et texte intégral de la GPL"><p class="license-intro">Vos droits d’utilisation, de modification et de partage, les mentions des auteurs et la licence GNU GPLv3 intégrale.</p><pre id="license-text">Chargement de la licence…</pre></div><label class="accept"><input id="accept-license" type="checkbox" disabled>J’ai pris connaissance de la licence et des crédits.</label></section>
<section data-step="1" hidden aria-labelledby="action-title"><h1 id="action-title"><svg viewBox="0 0 24 24"><path d="M3 7h18M3 17h18M8 4v6m8 4v6"/></svg>Choisir une action</h1><div class="action-list">
<label class="action-option"><input type="radio" name="action" value="install" checked><svg viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 15v5h16v-5"/></svg><span>Installer / mettre à jour PulseCord</span></label>
<label class="action-option"><input type="radio" name="action" value="repair"><svg viewBox="0 0 24 24"><path d="m14 6 4 4m-4-4 2-3a6 6 0 0 0-7 7L3 17l4 4 7-7a6 6 0 0 0 7-7l-3 3"/></svg><span>Réparer / réinstaller PulseCord</span></label>
<label class="action-option"><input type="radio" name="action" value="uninstall"><svg viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></svg><span>Désinstaller PulseCord</span></label>
<label class="action-option"><input type="radio" name="action" value="rollback"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg><span>Restaurer la version précédente</span></label>
</div></section>
<section data-step="2" hidden aria-labelledby="targets-title"><h1 id="targets-title"><svg viewBox="0 0 24 24"><path d="M4 4h16v13H4zM8 21h8m-4-4v4m-5-10 3 3 6-6"/></svg>Choisir les installations Discord</h1><div id="targets" class="targets" role="group" aria-label="Installations disponibles"></div><button id="refresh" class="text-button">Détecter à nouveau</button></section>
<section data-step="3" hidden aria-labelledby="operation-title"><h1 id="operation-title"><svg viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 15v5h16v-5"/></svg><span id="operation-heading">Installation</span></h1><div id="operation-log" class="operation-log" role="log" aria-live="polite" aria-label="Journal de l’opération"></div><progress id="progress" value="0" max="100" aria-label="Progression de l’opération"></progress><p id="operation-summary" class="operation-summary" role="status"></p></section>
<p id="status" class="status" role="status" aria-live="polite">Détection des installations…</p>
</main><footer><div class="footer-brand"><img src="assets/pulsecord-logo.png" width="25" height="25" alt=""><span>PulseCord</span><span id="step-count">1 / 4</span></div><div class="navigation"><button id="back" disabled>Retour</button><button id="next" class="primary" disabled>Suivant</button></div></footer>
<script src="wizard.js"></script><script src="ui.js"></script></body></html>
